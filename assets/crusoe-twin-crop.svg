<svg xmlns="http://www.w3.org/2000/svg" viewBox="52 132 1496 490" width="1496" height="490" font-family="'Barlow Semi Condensed','Barlow',sans-serif">
<style>
.tw-flow{fill:none;stroke:#FFFFFF;stroke-opacity:.8;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:14 22;animation:tw-dash 2.2s linear infinite}
.tw-fan{animation:tw-spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw-dash{to{stroke-dashoffset:-72}}
@keyframes tw-spin{to{transform:rotate(360deg)}}
.tw-w{font:600 14px 'Barlow Semi Condensed','Barlow',sans-serif;fill:#FFFFFF}

.vz-t{fill:#142019}.vz-sub{font:500 16px 'Barlow Semi Condensed','Barlow',sans-serif;fill:#47574D}
.vz-lab{font:600 14px 'Barlow Semi Condensed','Barlow',sans-serif;fill:#142019}
.vz-sm{font:500 13px 'Barlow Semi Condensed','Barlow',sans-serif;fill:#47574D}
.vz-mono{font-family:ui-monospace,'Cascadia Mono',Consolas,monospace}
@media (prefers-reduced-motion: reduce){.vz-anim{animation:none!important}}
</style>
